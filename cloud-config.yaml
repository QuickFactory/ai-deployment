#cloud-config
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true
packages:
  - curl
  - gnupg
  - lsb-release
  - openssl
  - git
  - gettext-base
  - python3
  - python3-pip

write_files:
  # =====================================================================
  # 1. Non-interactive boot phase: storage, downloads, Docker engine.
  #    Interactive decisions (domains, keys, LibreChat y/n) live in
  #    configure-ai, which this script installs.
  # =====================================================================
  - path: /opt/ai-stack/init-setup.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -e

      mkdir -p /mnt/ai-volume
      TARGET_DEVICE=""
      if [ -b /dev/vdb ]; then TARGET_DEVICE="/dev/vdb";
      elif [ -b /dev/sdb ]; then TARGET_DEVICE="/dev/sdb"; fi
      if [ -n "$TARGET_DEVICE" ]; then
        blkid "$TARGET_DEVICE" >/dev/null 2>&1 || mkfs.ext4 -F "$TARGET_DEVICE"
        if ! mountpoint -q /mnt/ai-volume; then
          mount "$TARGET_DEVICE" /mnt/ai-volume
          grep -q "/mnt/ai-volume" /etc/fstab || \
            echo "${TARGET_DEVICE} /mnt/ai-volume ext4 defaults,noatime,nofail 0 0" >> /etc/fstab
        fi
      fi

      cd /opt/ai-stack
      GITHUB_USER="QuickFactory"
      GITHUB_REPO="ai-deployment"
      BRANCH="dbl"
      RAW_URL="https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}"

      robust_curl() {
        local url=$1 output=$2 max_attempts=10 delay=5
        for i in $(seq 1 $max_attempts); do
          if curl -sSL "$url" -o "$output"; then return 0; fi
          echo "Retry $i/$max_attempts for $output..."; sleep $delay
        done
        echo "ERROR: could not download $output"; exit 1
      }

      echo "=== 1. Pulling configuration manifests ==="
      mkdir -p nginx-conf/vhost.d ingest-image
      robust_curl "${RAW_URL}/docker-compose.yml"                       "docker-compose.yml"
      robust_curl "${RAW_URL}/nginx-conf/api-location.conf.template"    "nginx-conf/api-location.conf.template"
      robust_curl "${RAW_URL}/ingest-image/Dockerfile"                  "ingest-image/Dockerfile"
      robust_curl "${RAW_URL}/ingest-image/ingest_watcher.py"           "ingest-image/ingest_watcher.py"
      # librechat.yaml is fetched by configure-ai only if LibreChat is enabled.

      # Placeholder so nginx-proxy's bind mount is a FILE at first `up`
      # (real map is written by configure-ai). Valid empty map:
      cat <<'PLACEHOLDER' > nginx-conf/api-keys.conf
      map $http_authorization $api_client { default ""; }
      PLACEHOLDER

      # The client-key map's keys are ~47 chars ("Bearer hk-" + 40 hex
      # chars from openssl rand -hex 20). nginx's default map_hash_bucket_size
      # is too small for that once configure-ai fills in real keys, causing
      # nginx to refuse to start entirely with "could not build map_hash,
      # you should increase map_hash_bucket_size". Generate this upfront so
      # it's in place before configure-ai ever populates real keys.
      # The "00-" prefix matters: nginx-proxy loads /etc/nginx/conf.d/*.conf
      # alphabetically, and nginx builds each map's hash table as it parses
      # that map block, so this MUST load before api-keys.conf (which
      # contains the map block) or the setting has no effect.
      cat <<'MAPHASH' > nginx-conf/00-map-hash-size.conf
      map_hash_bucket_size 128;
      MAPHASH

      echo "=== 2. Storage layer ==="
      if mountpoint -q /mnt/ai-volume; then
        BASE_DATA_DIR="/mnt/ai-volume"
      else
        BASE_DATA_DIR="/opt/ai-stack/local_data"
      fi
      for d in hermes_data rag_data searxng librechat_data mongo_data postgres_data \
               ingest/inbox ingest/processed ingest/failed; do
        mkdir -p "${BASE_DATA_DIR}/${d}"
      done
      chown -R 1000:1000 "${BASE_DATA_DIR}/ingest"
      for l in hermes_data rag_data searxng librechat_data mongo_data postgres_data ingest; do
        ln -sfn "${BASE_DATA_DIR}/${l}" "./${l}"
      done
      touch ./librechat_data/.env

      if [ ! -f ./searxng/settings.yml ]; then
        cat <<EOF > ./searxng/settings.yml
      use_default_settings: true
      server:
        port: 8080
        bind_address: "0.0.0.0"
        secret_key: "$(openssl rand -hex 16)"
      EOF
      fi

      echo "=== 3. Docker engine ==="
      mkdir -p /etc/apt/keyrings
      if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      fi
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # =================================================================
      # Interactive wizard, run manually after first SSH login
      # =================================================================
      cat <<'WRAPEOF' > /usr/bin/configure-ai
      #!/bin/bash
      set -e
      cd /opt/ai-stack

      # configure-ai runs as its own script, in its own process, after
      # SSH login — it does NOT inherit RAW_URL (or anything else) from
      # init-setup.sh's shell. Without this, ${RAW_URL} below was empty,
      # so the librechat.yaml curl became "curl -sSL /librechat.yaml" with
      # no host, producing: "curl: (3) URL rejected: No host part in the URL".
      GITHUB_USER="QuickFactory"
      GITHUB_REPO="ai-deployment"
      BRANCH="dbl"
      RAW_URL="https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}"

      if [ -f .env ]; then
        echo "A .env already exists. Edit it directly, or remove it to re-run."; exit 1
      fi

      echo "=========================================================="
      echo " HERMES STACK CONFIGURATION"
      echo " Each public service gets its own DuckDNS subdomain."
      echo " Enter subdomain NAMES only (without .duckdns.org)."
      echo "=========================================================="
      read -p  "DuckDNS subdomain for the Hermes DASHBOARD: " DUCK_DASH
      read -p  "DuckDNS subdomain for the Hermes API:" DUCK_API
      read -p  "Let's Encrypt notification email: " USER_EMAIL
      read -p  "OpenRouter API key (sk-or-...): " USER_OR_KEY
      read -p  "DuckDNS account token: " DUCK_TOKEN
      read -sp "Password for the Hermes dashboard: " HERMES_PASSWORD
      echo ""
      read -p  "Discord Bot Token: " DISCORD_BOT_TOKEN
      read -p  "Discord Channel ID: " DISCORD_CHANNEL_ID
      echo ""
      read -p  "Install LibreChat frontend? [y/N]: " INSTALL_LC

      DUCK_SUBS="${DUCK_DASH},${DUCK_API}"
      LC_BLOCK=""
      if [[ "$INSTALL_LC" =~ ^[Yy]$ ]]; then
        read -p "DuckDNS subdomain for LibreChat: " DUCK_LC
        DUCK_SUBS="${DUCK_SUBS},${DUCK_LC}"
        curl -sSL "${RAW_URL}/librechat.yaml" -o librechat.yaml
        LC_BLOCK=$(printf '%s\n' \
          "COMPOSE_PROFILES=librechat" \
          "LIBRECHAT_DOMAIN=${DUCK_LC}.duckdns.org" \
          "LIBRECHAT_JWT_SECRET=$(openssl rand -hex 24)" \
          "LIBRECHAT_JWT_REFRESH_SECRET=$(openssl rand -hex 24)")
      fi

      echo "=== DuckDNS sync (all subdomains, one call) ==="
      DUCK_RESPONSE=$(curl -s "https://www.duckdns.org/update?domains=${DUCK_SUBS}&token=${DUCK_TOKEN}&ip=")
      if [ "$DUCK_RESPONSE" != "OK" ]; then
        echo "ERROR: DuckDNS rejected the update for: ${DUCK_SUBS}"; exit 1
      fi

      AI_DOMAIN="${DUCK_DASH}.duckdns.org"
      API_DOMAIN="${DUCK_API}.duckdns.org"
      HERMES_INTERNAL_TOKEN=$(openssl rand -hex 24)

      echo "=== Generating 5 client API keys ==="
      KEYS_FILE=/opt/ai-stack/api-keys.txt
      : > "$KEYS_FILE"; chmod 600 "$KEYS_FILE"
      {
        echo 'map $http_authorization $api_client {'
        echo '    default "";'
        for i in 1 2 3 4 5; do
          KEY="hk-$(openssl rand -hex 20)"
          echo "    \"Bearer ${KEY}\" \"client${i}\";"
          echo "client${i}  ${KEY}" >> "$KEYS_FILE"
        done
        echo '}'
      } > nginx-conf/api-keys.conf

      sed "s/__HERMES_INTERNAL_TOKEN__/${HERMES_INTERNAL_TOKEN}/" \
        nginx-conf/api-location.conf.template > "nginx-conf/vhost.d/${API_DOMAIN}_location"

      cat <<EOT > .env
      AI_DOMAIN=${AI_DOMAIN}
      API_DOMAIN=${API_DOMAIN}
      LETSENCRYPT_EMAIL=${USER_EMAIL}
      OPENROUTER_API_KEY=${USER_OR_KEY}
      DUCKDNS_SUBDOMAINS=${DUCK_SUBS}
      DUCKDNS_TOKEN=${DUCK_TOKEN}
      HERMES_INTERNAL_TOKEN=${HERMES_INTERNAL_TOKEN}
      RAG_INTERNAL_API_KEY=$(openssl rand -hex 16)
      POSTGRES_DB_PASSWORD=$(openssl rand -hex 16)
      OCR_LANGUAGES=eng
      INGEST_POLL_INTERVAL=20
      DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      ${LC_BLOCK}
      EOT
      chmod 600 .env

      echo "=== Starting the stack ==="
      docker compose --env-file .env up -d --build

      # A blind `sleep 30` isn't a real readiness check — Hermes'
      # gateway/plugin init can legitimately take longer than that,
      # especially on first boot with --build. Poll instead of guessing.
      echo "=== Waiting for Hermes to be ready for exec (up to 3 min) ==="
      HERMES_READY=0
      for i in $(seq 1 36); do
        if docker compose exec -T hermes python -c "import plugins.dashboard_auth.basic" 2>/dev/null; then
          HERMES_READY=1
          break
        fi
        printf "."
        sleep 5
      done
      echo ""

      echo "=== Configuring Hermes dashboard basic auth ==="
      # Don't discard stderr — log it, so a failure is diagnosable
      # instead of silently producing an empty hash. Also retry a few
      # times in case the container is up but still finishing init.
      HASH_LOG=/opt/ai-stack/dashboard-auth-setup.log
      : > "$HASH_LOG"
      HERMES_HASH=""
      if [ "$HERMES_READY" -eq 1 ]; then
        for i in 1 2 3; do
          HERMES_HASH=$(docker compose exec -T hermes python -c \
            "from plugins.dashboard_auth.basic import hash_password; print(hash_password('${HERMES_PASSWORD}'))" \
            2>>"$HASH_LOG")
          [ -n "$HERMES_HASH" ] && break
          sleep 5
        done
      fi

      if [ -z "$HERMES_HASH" ]; then
        echo "WARN: could not generate dashboard password hash after retries."
        echo "      See ${HASH_LOG} for the actual error."
        echo "      Fix it anytime with: sudo /opt/ai-stack/set-dashboard-password.sh"
      else
        # A bare `grep -q 'dashboard:'` matches Hermes' own default
        # config.yaml, which ships full of COMMENTED example blocks like
        # "# dashboard:" and "#   oauth:" documenting OAuth/OIDC options.
        # That false-positive match made this guard think a real config
        # already existed and silently skip the append — every time, on
        # every fresh install — so the actual basic_auth block never got
        # written at all. Anchor the match to a real, uncommented,
        # column-0 top-level key so commented documentation can't trigger it.
        docker compose exec -T hermes bash -c "grep -qE '^dashboard:' /opt/data/config.yaml || cat >> /opt/data/config.yaml << 'HERMESCFG'
      dashboard:
        basic_auth:
          username: \"admin\"
          password_hash: \"${HERMES_HASH}\"
      HERMESCFG"
        # `docker compose up -d hermes` is a no-op here — Compose only
        # recreates a container when it detects a change to the service's
        # own definition (image, env, compose file), and editing config.yaml
        # via `docker compose exec` from inside the running container is
        # invisible to that diff. Without an explicit restart, Hermes just
        # keeps running with its original (auth-less) config forever, and
        # keeps refusing to bind the dashboard no matter how many times this
        # step "succeeds". `restart` forces it to actually reload the file.
        docker compose restart hermes
      fi

      # Standalone helper so setting/resetting the dashboard password never
      # again requires hand-typed docker exec + sed commands.
      cat <<'PWEOF' > /opt/ai-stack/set-dashboard-password.sh
      #!/bin/bash
      set -e
      cd /opt/ai-stack
      read -sp "New Hermes dashboard password: " NEW_PASSWORD
      echo ""
      HASH=$(docker compose exec -T hermes python -c \
        "from plugins.dashboard_auth.basic import hash_password; print(hash_password('${NEW_PASSWORD}'))")
      if [ -z "$HASH" ]; then
        echo "ERROR: hash generation failed. Is the hermes container running? (docker compose ps hermes)"
        exit 1
      fi
      # Anchor to a real, uncommented, column-0 top-level key — a bare
      # 'dashboard:' substring also matches the commented example blocks
      # Hermes ships by default in config.yaml, which would wrongly take
      # the "just replace the hash" branch below even when no real
      # basic_auth block exists yet, silently leaving auth unconfigured.
      if docker compose exec -T hermes grep -qE '^dashboard:' /opt/data/config.yaml; then
        docker compose exec -T hermes sed -i "s|password_hash: \".*\"|password_hash: \"${HASH}\"|" /opt/data/config.yaml
      else
        docker compose exec -T hermes bash -c "cat >> /opt/data/config.yaml << HERMESCFG
      dashboard:
        basic_auth:
          username: \"admin\"
          password_hash: \"${HASH}\"
      HERMESCFG"
      fi
      docker compose restart hermes
      echo "Dashboard password updated. Restarting hermes..."
      PWEOF
      chmod +x /opt/ai-stack/set-dashboard-password.sh

      echo "=== Installing DuckDNS auto-refresh cron (every 5 min, all subs) ==="
      (crontab -l 2>/dev/null; echo "*/5 * * * * curl -s 'https://www.duckdns.org/update?domains=${DUCK_SUBS}&token=${DUCK_TOKEN}&ip=' > /dev/null 2>&1") | crontab -

      echo "=== Waiting for HTTPS to come up (valid certificates) ==="
      # curl WITHOUT -k: only succeeds once a browser-trusted cert is
      # served, so this waits for real Let's Encrypt issuance rather
      # than nginx-proxy's interim self-signed default.
      DOMAINS_TO_CHECK="${AI_DOMAIN} ${API_DOMAIN}"
      if [[ "$INSTALL_LC" =~ ^[Yy]$ ]]; then
        DOMAINS_TO_CHECK="${DOMAINS_TO_CHECK} ${DUCK_LC}.duckdns.org"
      fi
      CERT_FAILURES=0
      for d in $DOMAINS_TO_CHECK; do
        printf "  %-45s " "$d"
        ok=0
        for i in $(seq 1 60); do   # up to 10 minutes per domain
          if curl -s -o /dev/null --max-time 10 "https://${d}"; then
            echo "OK"
            ok=1
            break
          fi
          printf "."
          sleep 10
        done
        if [ "$ok" -ne 1 ]; then
          echo " TIMEOUT"
          CERT_FAILURES=$((CERT_FAILURES+1))
        fi
      done
      if [ "$CERT_FAILURES" -gt 0 ]; then
        echo ""
        echo "WARN: ${CERT_FAILURES} domain(s) never presented a valid certificate."
        echo "      Diagnose with: docker logs nginx-ssl-companion"
        echo "      docker exec nginx-proxy nginx -t   (check for config errors, e.g."
        echo "        map_hash_bucket_size, which will silently block ALL domains)"
        echo "      Common causes: DNS not propagated yet, port 80 blocked,"
        echo "      or Let's Encrypt rate limits on duckdns.org names."
      fi

      echo "=========================================================="
      echo " DEPLOYED."
      echo "   Dashboard : https://${AI_DOMAIN}   (admin / your password)"
      echo "   API       : https://${API_DOMAIN}/v1  (Bearer <client key>)"
      if [[ "$INSTALL_LC" =~ ^[Yy]$ ]]; then
      echo "   LibreChat : https://${DUCK_LC}.duckdns.org"
      fi
      echo "   Ingest    : drop files into /opt/ai-stack/ingest/inbox/"
      echo ""
      echo " Reset the dashboard password anytime with:"
      echo "   sudo /opt/ai-stack/set-dashboard-password.sh"
      echo ""
      echo " Client API keys (saved to ${KEYS_FILE}):"
      cat "$KEYS_FILE"
      echo ""
      echo " Revoke a key: edit nginx-conf/api-keys.conf, then:"
      echo "   docker exec nginx-proxy nginx -s reload"
      echo "=========================================================="
      WRAPEOF
      chmod +x /usr/bin/configure-ai

  # =====================================================================
  # 2. SSH login banner
  # =====================================================================
  - path: /etc/update-motd.d/99-ai-stack-status
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      echo "==============================================================="
      echo " HERMES-FIRST AI DEPLOYMENT FRAMEWORK"
      echo "==============================================================="
      if [ ! -f /opt/ai-stack/.env ]; then
        echo " To finalize setup (domains, API keys, optional LibreChat):"
        echo "   sudo configure-ai"
      else
        echo " Stack configured. Ingest inbox: /opt/ai-stack/ingest/inbox/"
        echo " Client API keys: /opt/ai-stack/api-keys.txt"
        echo " Reset dashboard password: sudo /opt/ai-stack/set-dashboard-password.sh"
        echo " Safe shutdown: sudo /opt/ai-stack/safeshut.sh"
      fi
      echo "==============================================================="

runcmd:
  # 1. 4GB swap guard against OOM on low-RAM servers
  - if [ ! -f /swapfile ]; then fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi
  # 2. Docker dual-stack IPv6
  - mkdir -p /etc/docker
  - echo '{"ipv6":true,"fixed-cidr-v6":"fd00::/80","ip6tables":true}' > /etc/docker/daemon.json
  - systemctl restart docker || true
  # 3. Run the boot-phase setup
  - mkdir -p /opt/ai-stack
  - cd /opt/ai-stack
  - bash /opt/ai-stack/init-setup.sh
