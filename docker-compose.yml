services:
  # 1. Core Hermes AI Engine — owns BOTH public vhosts (dashboard + API)
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    # SECURITY NOTE:
    # this container runs as root, is added to the docker group, AND has
    # /var/run/docker.sock mounted below. That combination gives it
    # host-root-equivalent access. Combined with GATEWAY_ALLOW_ALL_USERS=true
    # and Discord control, anyone with access to the configured Discord
    # bot/channel can effectively issue commands to a process with full
    # control of the host. If you don't need Hermes to manage other
    # containers, drop the docker.sock mount, the group_add line, and
    # "user: root" entirely.
    user: "root"
    group_add:
      - 107
    restart: unless-stopped
    entrypoint: ["/init", "/opt/hermes/docker/main-wrapper.sh"]
    command: ["gateway", "run"]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
      # Single internal token. Public clients never see it: nginx validates
      # one of the 5 client keys and swaps in this token (see vhost.d snippet).
      - API_SERVER_KEY=${HERMES_INTERNAL_TOKEN}
      - BROWSER_CDP_URL=ws://hermes-browser:3000
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - GATEWAY_ALLOW_ALL_USERS=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HERMES_MODEL_PROVIDER=openrouter
      - HERMES_MODEL=google/gemini-2.5-flash
      - HERMES_AUXILIARY_DEFAULT_PROVIDER=openrouter
      - HERMES_AUXILIARY_DEFAULT_MODEL=google/gemma-4-26b-a4b-it:free
      - HERMES_AUXILIARY_VISION_PROVIDER=openrouter
      - HERMES_AUXILIARY_VISION_MODEL=google/gemma-4-26b-a4b-it:free
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_HOST=0.0.0.0
      # RAG access for the Hermes retrieval tool (Stage 3b)
      - RAG_API_URL=http://rag_api:8000
      - RAG_API_KEY=${RAG_INTERNAL_API_KEY}
      # ---- nginx-proxy vhost declarations (two DuckDNS domains, one cert each) ----
      - LETSENCRYPT_HOST=${AI_DOMAIN},${API_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - |
        VIRTUAL_HOST_MULTIPORTS=${AI_DOMAIN}:
          "/":
            port: 9119
        ${API_DOMAIN}:
          "/":
            port: 8642
    volumes:
      - ./hermes_data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - hermes-browser
    networks:
      - ai-network

  # 2. Headless Chrome for Hermes — internal only (was 9222:3000)
  hermes-browser:
    image: browserless/chrome:1.61-chrome-stable
    container_name: hermes-browser
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=2 # each live session ~300-500MB; 2 is the 4GB-safe ceiling
    networks:
      - ai-network

  # 3. SearXNG — internal only (was 8081:8080)
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - ai-network

  # 4. Nginx Reverse Proxy — the ONLY public entry points (80/443)
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - ./nginx-conf/vhost.d:/etc/nginx/vhost.d # bind mount: deploy.sh drops the API auth snippet here
      - html:/usr/share/nginx/html
      - ./nginx-conf/api-keys.conf:/etc/nginx/conf.d/api-keys.conf:ro # map of 5 client keys
      # The generated api-keys.conf map has ~47-char keys ("Bearer hk-"
      # + 40 hex chars). nginx's default map_hash_bucket_size (32/64 depending
      # on platform) is too small for that, causing nginx to refuse to start
      # entirely with "could not build map_hash, you should increase
      # map_hash_bucket_size". This raises it well above what's needed.
      # NOTE: nginx-proxy loads /etc/nginx/conf.d/*.conf alphabetically, and
      # nginx builds each map's hash table as it parses that map block — a
      # bucket-size directive that loads AFTER the map has no effect. The
      # "00-" prefix forces this file to sort (and load) before
      # api-keys.conf, which is required for the setting to actually apply.
      - ./nginx-conf/00-map-hash-size.conf:/etc/nginx/conf.d/00-map-hash-size.conf:ro
    networks:
      - ai-network
    depends_on:
      - hermes

  # 5. Let's Encrypt SSL Companion
  nginx-ssl-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-ssl-companion
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - ./nginx-conf/vhost.d:/etc/nginx/vhost.d # must share the same vhost.d as nginx-proxy
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_PROXY_CONTAINER=nginx-proxy
    depends_on:
      - nginx-proxy
    networks:
      - ai-network

  # 6. LibreChat Frontend — OPTIONAL (enabled via COMPOSE_PROFILES=librechat)
  librechat:
    profiles: ["librechat"]
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    expose:
      - "3080"
    environment:
      - VIRTUAL_HOST=${LIBRECHAT_DOMAIN}
      - VIRTUAL_PORT=3080
      - LETSENCRYPT_HOST=${LIBRECHAT_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - MONGO_URI=mongodb://librechat-mongo:27017/librechat
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET}
      - TITLE=AI Enabled World
      - CONFIG_PATH=/app/librechat.yaml
      # SECURITY NOTE: open registration + social login on a
      # publicly reachable domain lets anyone who finds the URL create an
      # account and spend your OPENROUTER_API_KEY credits. Set both to
      # "false" (or add an allowlist) if this isn't meant to be public.
      - ALLOW_REGISTRATION=true
      - ALLOW_SOCIAL_LOGIN=true
      - SEARXNG_INSTANCE_URL=http://searxng:8080
      # NOTE: no firecrawl service is defined in this file, and
      # "localhost" inside this container refers to the container itself,
      # not another service — this URL points at nothing and firecrawl
      # features will silently fail if librechat.yaml enables them.
      - FIRECRAWL_API_KEY=not-needed-using-cheerio
      - FIRECRAWL_API_URL=http://localhost:3002
      - RAG_API_TOP_K=3
      - RAG_CHUNK_SIZE=1000
      - RAG_CHUNK_OVERLAP=100
      - RAG_API_URL=http://rag_api:8000
      - RAG_API_KEY=${RAG_INTERNAL_API_KEY}
      - OPENROUTER_KEY=${OPENROUTER_API_KEY}
      - HERMES_INTERNAL_TOKEN=${HERMES_INTERNAL_TOKEN}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./librechat_data:/app/client/public/assets
      - ./librechat_data/.env:/app/.env
    depends_on:
      - mongo
    networks:
      - ai-network

  # 7. RAG API — ALWAYS ON (Hermes infrastructure, not LibreChat's). Internal only.
  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: rag_api
    environment:
      - RAG_API_KEY=${RAG_INTERNAL_API_KEY}
      - DB_TYPE=local
      - VECTOR_DB_TYPE=pgvector
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - RAG_OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - RAG_OPENAI_BASEURL=https://openrouter.ai/api/v1
      - EMBEDDINGS_PROVIDER=openai
      - EMBEDDINGS_MODEL=openai/text-embedding-3-small
    volumes:
      - ./rag_data:/app/data
    expose:
      - "8000"
    depends_on:
      - db
    restart: always
    networks:
      - ai-network

  # 8. PostgreSQL with pgvector — ALWAYS ON
  db:
    image: ankane/pgvector:v0.5.1
    container_name: rag_postgres
    environment:
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - ai-network
    restart: always

  # 9. MongoDB — only exists for LibreChat
  mongo:
    profiles: ["librechat"]
    image: mongo:7-jammy
    container_name: librechat-mongo
    command: --wiredTigerCacheSizeGB 0.5
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db
    networks:
      - ai-network

  # 10. Folder-drop ingest watcher with scanned-PDF OCR (ocrmypdf/Tesseract)
  #     Memory-capped, low CPU priority, serial processing: OCR bursts can
  #     never starve Hermes or the databases.
  rag-ingest:
    build: ./ingest-image
    container_name: rag-ingest
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 0.75
    environment:
      - RAG_API_URL=http://rag_api:8000
      - RAG_API_KEY=${RAG_INTERNAL_API_KEY}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-eng}
      - POLL_INTERVAL=${INGEST_POLL_INTERVAL:-20}
    volumes:
      - ./ingest:/data
    depends_on:
      - rag_api
    networks:
      - ai-network

volumes:
  certs:
  html:
  acme:

networks:
  ai-network:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00:dead:beef::/48
